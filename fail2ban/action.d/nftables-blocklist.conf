# Fail2Ban action: ban into nft-blocklist's dynamic sets.
#
# Why this exists: nft-blocklist owns the static (feed-driven) sets and
# flushes them atomically on every update. Reactive bans therefore live in
# the separate dynamic4/dynamic6 sets, which feed updates NEVER touch — a
# nightly refresh can't un-ban an attacker fail2ban just caught, and
# fail2ban's own unban timing stays authoritative.
#
# Install:
#   cp nftables-blocklist.conf /etc/fail2ban/action.d/
#   then set `banaction = nftables-blocklist` in your jail (see ../jail.d/).
#
# The sets and drop rules are created by nft-blocklist itself; actionstart
# only covers the case where fail2ban starts before the first blocklist run.

[Definition]
actionstart = nft add table inet <table>
              nft add set inet <table> dynamic4 { type ipv4_addr\; flags timeout\; }
              nft add set inet <table> dynamic6 { type ipv6_addr\; flags timeout\; }

# Sets stay in place on stop: bans outliving a fail2ban restart is the
# desired behavior, and nft-blocklist references these sets in its rules.
actionstop =

actioncheck = nft list set inet <table> dynamic4 > /dev/null

actionban = nft add element inet <table> dynamic<fam> { <ip> timeout <bantime>s }

actionunban = nft delete element inet <table> dynamic<fam> { <ip> }

[Init]
table = blocklist
# populated by fail2ban: 4 or 6 depending on the banned address family
fam = 4
bantime = 86400

[Init?family=inet6]
fam = 6
