version: "2"

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - gocritic
    - revive
  settings:
    errcheck:
      # Conventional best-effort writes: formatting to an in-process
      # writer, HTTP response bodies, and deferred Close on read paths.
      # Real I/O whose failure matters (files, nft, state) is checked.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (io.Closer).Close
        - (*os.File).Close
        - (net/http.ResponseWriter).Write
    revive:
      rules:
        - name: exported
          disabled: true

formatters:
  enable:
    - gofmt
