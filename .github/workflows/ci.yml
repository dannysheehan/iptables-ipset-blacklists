name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: gofmt
        run: test -z "$(gofmt -l cmd internal test/e2e/feedserver)"
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
      - name: shellcheck
        run: |
          sudo apt-get update -q && sudo apt-get install -y shellcheck
          shellcheck test/integration/*.sh test/e2e/*.sh || true
          # legacy script is frozen; lint informationally only
          shellcheck legacy/blacklists.sh || true
      - name: yamllint
        run: |
          pipx install yamllint
          yamllint -d relaxed configs .github/workflows

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go test -race -coverprofile=coverage.out ./...
      - run: go tool cover -func=coverage.out | tail -1

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: install nftables
        run: sudo apt-get update -q && sudo apt-get install -y nftables
      - name: run netns integration tests (unprivileged, self-namespacing)
        run: make integration

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest
      - run: make package
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: dist/
